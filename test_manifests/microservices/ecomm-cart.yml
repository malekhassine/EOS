apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart
          image: malekhassine/ecomm-cart_test
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
          # Liveness Probe: checks if the app is still running
          livenessProbe:
            httpGet:
              path: /healthz  # Make sure your app has a health endpoint
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # Readiness Probe: checks if the app is ready to accept traffic
          readinessProbe:
            httpGet:
              path: /readiness  # Make sure your app has a readiness endpoint
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: cart
  ports:
    - port: 8082
      targetPort: 8082

